# wasmfleet 插件自动发布模板（Rust）
# 放到源码仓库的 .github/workflows/release.yml
#
# 行为：每次推送到 main → 编译各平台 → 创建正式版 Release（附件 + SHA256SUMS）→ 打同名 tag
# 版本号：<Cargo.toml 主版本>.<次版本>.<运行序号>，例如 1.0.7（升主/次版本时改 Cargo.toml）
#
# 需要改的地方：
#   1. env.BIN：Cargo.toml 里 [package] name（即编译出的程序名）
#   2. env.RELEASE_REPO：发布到哪里（见下方说明，决定是否需要 RELEASE_TOKEN）
#   3. build.matrix：需要的平台（默认 macOS arm64 + Linux x64 musl）
#
# 发布模式（详见 references/release.md）：
#   - 开源（公开仓库，源码和发布在同一个仓库）：RELEASE_REPO 设为 github.repository，
#     不需要任何 Secret，Actions 自带的令牌就能创建 Release
#   - 闭源（源码仓库私有，Release 发在 <源码仓库>-releases，发布仓库可公开或私有）：
#     RELEASE_REPO 设为 github.repository 加 -releases，并在源码仓库添加 Secret RELEASE_TOKEN
#     （细粒度令牌，只授权发布仓库，Contents: Read and write）
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 打 tag；同仓库发布时还用于创建 Release

concurrency:
  group: release
  cancel-in-progress: false

env:
  BIN: my-plugin # ← 改成你的程序名
  # 开源（同仓库）：${{ github.repository }}
  # 闭源（分仓库）：${{ github.repository }}-releases
  RELEASE_REPO: ${{ github.repository }}-releases
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          base=$(sed -n 's/^version *= *"\([0-9]*\)\.\([0-9]*\)\..*"/\1.\2/p' Cargo.toml | head -1)
          [ -n "$base" ] || { echo "无法从 Cargo.toml 读取版本号"; exit 1; }
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          # 中控只在 macOS / Linux 上运行，按需增减平台
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
          # Linux 用 musl：静态链接，任何发行版都能直接运行
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            apt: musl-tools
          # - target: x86_64-apple-darwin          # Intel Mac
          #   os: macos-latest
          #   ext: ""
          # - target: aarch64-unknown-linux-gnu    # ARM64 Linux（需要 ARM runner）
          #   os: ubuntu-24.04-arm
          #   ext: ""
          # - target: x86_64-pc-windows-msvc       # 中控会忽略 .exe，只在有其他用途时才编
          #   os: windows-latest
          #   ext: ".exe"
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: 编译
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: 整理产物
        shell: bash
        run: |
          mkdir -p out
          asset="server-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/${BIN}${{ matrix.ext }}" "out/$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: out/${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: 生成 SHA256SUMS
        working-directory: dist
        run: |
          chmod +x server-*
          sha256sum server-* > SHA256SUMS
          cat SHA256SUMS
      - name: 检查令牌
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ "$RELEASE_REPO" != "$GITHUB_REPOSITORY" ] && [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::发布到独立仓库 $RELEASE_REPO 需要 Secret RELEASE_TOKEN（只授权该仓库、Contents 读写的细粒度令牌）"
            exit 1
          fi
      - name: 创建 Release
        env:
          # 独立发布仓库用 RELEASE_TOKEN；同仓库发布用 Actions 自带的令牌
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          {
            echo "源码提交：${GITHUB_SHA}"
            echo
            git log -1 --pretty=%B "$GITHUB_SHA"
            echo
            echo "运行：\`PORT=<端口> ./server-<平台>\`（默认只监听 127.0.0.1）"
          } > notes.md
          if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            # 重新运行同一次构建：覆盖附件
            gh release upload "$TAG" --repo "$RELEASE_REPO" --clobber dist/server-* dist/SHA256SUMS
          else
            target=()
            # 同仓库发布时，tag 指向本次构建的提交（独立发布仓库里没有这个提交）
            [ "$RELEASE_REPO" = "$GITHUB_REPOSITORY" ] && target=(--target "$GITHUB_SHA")
            gh release create "$TAG" --repo "$RELEASE_REPO" "${target[@]}" \
              --title "$TAG" --latest --notes-file notes.md \
              dist/server-* dist/SHA256SUMS
          fi
          echo "发布完成：https://github.com/$RELEASE_REPO/releases/tag/$TAG"
      - name: 源码仓库打 tag
        # 同仓库发布时，创建 Release 已经打好 tag
        if: env.RELEASE_REPO != github.repository
        run: |
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
