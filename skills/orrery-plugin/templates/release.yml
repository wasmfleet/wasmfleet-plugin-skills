# Orrery 插件自动发布模板（Rust）
# 放到源码仓库的 .github/workflows/release.yml
#
# 行为：每次推送到 main → 编译各平台 → 在发布仓库 <源码仓库>-releases 创建正式版 Release → 源码仓库打同名 tag
# 版本号：<Cargo.toml 主版本>.<次版本>.<运行序号>，例如 1.0.7（升主/次版本时改 Cargo.toml）
#
# 需要改的地方：
#   1. env.BIN：Cargo.toml 里 [package] name（即编译出的程序名）
#   2. build.matrix：需要的平台（默认 macOS arm64 + Linux x64 musl）
#
# 需要的 Secret（源码仓库 Settings → Secrets and variables → Actions）：
#   RELEASE_TOKEN  细粒度令牌，只授权发布仓库，Contents: Read and write
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 在源码仓库打 tag

concurrency:
  group: release
  cancel-in-progress: false

env:
  BIN: my-plugin # ← 改成你的程序名
  RELEASE_REPO: ${{ github.repository }}-releases
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          base=$(sed -n 's/^version *= *"\([0-9]*\)\.\([0-9]*\)\..*"/\1.\2/p' Cargo.toml | head -1)
          [ -n "$base" ] || { echo "无法从 Cargo.toml 读取版本号"; exit 1; }
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          # 中控只在 macOS / Linux 上运行，按需增减平台
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
          # Linux 用 musl：静态链接，任何发行版都能直接运行
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            apt: musl-tools
          # - target: x86_64-apple-darwin          # Intel Mac
          #   os: macos-latest
          #   ext: ""
          # - target: aarch64-unknown-linux-gnu    # ARM64 Linux（需要 ARM runner）
          #   os: ubuntu-24.04-arm
          #   ext: ""
          # - target: x86_64-pc-windows-msvc       # 中控会忽略 .exe，只在有其他用途时才编
          #   os: windows-latest
          #   ext: ".exe"
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: 编译
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: 整理产物
        shell: bash
        run: |
          mkdir -p out
          asset="server-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/${BIN}${{ matrix.ext }}" "out/$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: out/${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: 生成 SHA256SUMS
        working-directory: dist
        run: |
          chmod +x server-*
          sha256sum server-* > SHA256SUMS
          cat SHA256SUMS
      - name: 检查令牌
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::未设置 Secret RELEASE_TOKEN（需要对 $RELEASE_REPO 有 Contents 读写权限的细粒度令牌）"
            exit 1
          fi
      - name: 发布仓库创建 Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          {
            echo "源码提交：${GITHUB_SHA}"
            echo
            git log -1 --pretty=%B "$GITHUB_SHA"
          } > notes.md
          if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            # 重新运行同一次构建：覆盖附件
            gh release upload "$TAG" --repo "$RELEASE_REPO" --clobber dist/server-* dist/SHA256SUMS
          else
            gh release create "$TAG" --repo "$RELEASE_REPO" \
              --title "$TAG" --latest --notes-file notes.md \
              dist/server-* dist/SHA256SUMS
          fi
      - name: 源码仓库打 tag
        run: |
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
